name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first. `@kodama/engine` publishes its types from `dist/`, so
      # `service/` cannot be typechecked - or tested through the workspace
      # link - until the engine has been emitted. A developer's machine has a
      # `dist/` lying around from the last run and hides this; a clean checkout
      # does not.
      - name: Build
        run: pnpm -r build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm -r test

      # Size and render budgets, printed so drift is visible in the log rather
      # than discovered at a milestone gate. Fails the build on a cap breach.
      - name: Size and speed budgets
        run: pnpm size

  # Determinism is a product guarantee, and the cheapest place for it to break
  # is a platform difference in float formatting. Running the engine suite on
  # three operating systems turns that class of bug into a red build rather
  # than a user noticing their tree differs between two CDN regions.
  determinism-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Determinism and goldens
        run: pnpm --filter @kodama/engine test
