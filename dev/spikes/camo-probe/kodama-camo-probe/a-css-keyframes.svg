<svg xmlns="http://www.w3.org/2000/svg" width="240" height="60" viewBox="0 0 240 60">
  <!-- probe:css-keyframes v1 -->
  <style>
    @keyframes kd-slide { 0% { transform: translateX(0); } 50% { transform: translateX(180px); } 100% { transform: translateX(0); } }
    .dot { animation: kd-slide 3s ease-in-out infinite; }
  </style>
  <rect width="240" height="60" fill="#101312"/>
  <text x="10" y="20" fill="#9aa39d" font-family="monospace" font-size="11">a. css @keyframes</text>
  <circle class="dot" cx="20" cy="42" r="8" fill="#d97742"/>
</svg>
