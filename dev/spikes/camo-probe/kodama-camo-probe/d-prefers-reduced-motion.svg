<svg xmlns="http://www.w3.org/2000/svg" width="240" height="60" viewBox="0 0 240 60">
  <!-- probe:prefers-reduced-motion v1 -->
  <style>
    @keyframes kd-pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
    .p { animation: kd-pulse 3s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .p { animation: none; opacity: 1; } }
  </style>
  <rect width="240" height="60" fill="#101312"/>
  <text x="10" y="20" fill="#9aa39d" font-family="monospace" font-size="11">d. prefers-reduced-motion</text>
  <text x="10" y="36" fill="#6a6d64" font-family="monospace" font-size="9">dot holds still if reduce is on</text>
  <circle class="p" cx="210" cy="42" r="8" fill="#e08b4e"/>
</svg>
